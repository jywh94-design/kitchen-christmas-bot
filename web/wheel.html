<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>圣诞厨房寻宝季 · 幸运转盘</title>
<style>
  :root { --ink:#4A1D12; --red:#B3261E; --gold:#E8B84A; --cream:#FFF1D6; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; }
  body { background:#14231C; overflow:hidden; color:var(--ink);
    font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif; }
  #stage { position:absolute; left:50%; top:50%; width:1672px; height:941px; transform-origin:0 0;
    background:url(/wheel-assets/bg.jpg) 0 0/100% 100% no-repeat; }
  #stage > * { position:absolute; }
  #wheel { left:300px; top:106px; width:640px; height:640px; }
  #front { left:0; top:0; width:1672px; height:941px; pointer-events:none; }
  .t { transform:translate(-50%,-50%); white-space:nowrap; text-align:center; font-weight:800; }
  #title { left:690px; top:103px; font-size:38px; }
  #sub { left:985px; top:103px; font-size:30px; color:var(--red); }
  #entrants { left:1445px; top:129px; font-size:24px; }
  #badge { left:150px; top:170px; background:var(--gold); color:#14231C; font-size:22px; padding:4px 18px; border-radius:999px; border:2px solid #7a4a0a; }
  #ticker { left:620px; top:718px; font-size:26px; max-width:330px; overflow:hidden; text-overflow:ellipsis; }
  #spin { left:441px; top:768px; width:360px; height:91px; border:0; border-radius:46px; background:transparent; color:#fff;
    font:800 42px 'Noto Sans SC','Microsoft YaHei',sans-serif; letter-spacing:4px; text-shadow:0 3px 0 #7e1a12, 0 0 8px rgba(0,0,0,.35); cursor:pointer; }
  #spin:not(:disabled):hover { background:rgba(255,255,255,.12); }
  #spin:not(:disabled):active { transform:translateY(3px); }
  #spin:disabled { cursor:not-allowed; background:rgba(40,30,30,.45); color:#e6d8d0; }
  #hint { left:620px; top:884px; font-size:24px; color:var(--red); text-shadow:0 0 6px #fff, 0 0 6px #fff; font-weight:700; }
  #count { left:1240px; top:200px; }
  #rows { left:0; top:0; }
  .row { position:absolute; left:1028px; width:420px; height:57px; border-radius:11px; background:#FEECC8;
    border:2px solid #FA8C28; box-shadow:0 0 0 2px #2D0505; }
  .row > * { position:absolute; top:50%; transform:translateY(-50%); }
  .row .crown { left:10px; height:45px; }
  .row .num { left:0; width:88px; text-align:center; font-size:30px; font-weight:800; color:#965F46; }
  .row .snow { right:6px; height:40px; opacity:.9; }
  .row .av { left:90px; width:51px; height:51px; border-radius:50%; object-fit:cover; background:#c9a97f; border:2px solid #EBAA28; box-shadow:0 0 0 3px #784609; }
  .row .ph { left:91px; width:49px; height:49px; border-radius:50%; border:3px solid #CDA58C; }
  .row .nm { left:158px; width:205px; font-size:27px; font-weight:800; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row.empty .nm { color:#BE9682; font-size:24px; font-weight:700; }
  .row.ult { background:#FFE39A; }

  .overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(40,12,8,.62); z-index:20; transition:opacity .25s; }
  .overlay.hidden { opacity:0; pointer-events:none; }
  .card { text-align:center; background:var(--cream); border:6px solid var(--red); box-shadow:0 0 0 4px var(--gold), 0 20px 60px rgba(0,0,0,.6);
    border-radius:28px; padding:34px 64px; min-width:460px; max-width:80vw; }
  .card img, .card .ph { width:160px; height:160px; border-radius:50%; border:5px solid var(--gold); object-fit:cover; background:#c9a97f; margin:0 auto 14px; display:block; }
  #ov-title { font-size:28px; color:var(--red); font-weight:800; letter-spacing:3px; }
  #ov-name { font-size:clamp(36px,4.4vw,64px); font-weight:800; margin:8px 0; word-break:break-all; }
  #ov-sub { font-size:24px; min-height:32px; }
  #ov-sub b { color:var(--red); }
  #confetti { position:fixed; inset:0; pointer-events:none; z-index:30; }
  .gone { text-align:center; padding:80px 24px; font-size:28px; color:#fff; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="wheel" width="1280" height="1280"></canvas>
  <img id="front" src="/wheel-assets/front.png" alt="">
  <div id="title" class="t">圣诞幸运转盘</div>
  <div id="sub" class="t">厨房机密处</div>
  <div id="entrants" class="t"></div>
  <div id="badge" class="t" hidden>预演模式</div>
  <div id="ticker" class="t">&nbsp;</div>
  <button id="spin" disabled>开始转动</button>
  <div id="hint" class="t"></div>
  <div id="rows"></div>
</div>

<div id="overlay" class="overlay hidden">
  <div class="card">
    <div id="ov-avatar-wrap"></div>
    <div id="ov-title"></div>
    <div id="ov-name"></div>
    <div id="ov-sub"></div>
  </div>
</div>
<canvas id="confetti"></canvas>

<script>
const token = new URLSearchParams(location.search).get('s') || '';
const $ = (id) => document.getElementById(id);
const canvas = $('wheel'), ctx = canvas.getContext('2d');
const CX = 620, CY = 426;
const TAU = Math.PI * 2;
const COLORS = ['#00966E','#C81E28','#F08214','#FAC814','#8232A0','#1E64C8','#5AAA28','#821432'];

let state = null;
let rot = 0;
let spinning = false;
let serverOffset = 0;
let shownEventAt = 0;
let overlayTimer = null;

async function api(path, opts) {
  const r = await fetch(path + '?s=' + encodeURIComponent(token), opts);
  return r.json();
}

/* ---------- 转盘绘制（画布 1280px = 页面 640px，半径 286） ---------- */
const WR = 572;
function drawWheel(rotation) {
  const W = canvas.width, cx = W / 2, cy = W / 2, R = WR;
  ctx.clearRect(0, 0, W, W);
  const list = state ? state.participants : [];
  const total = list.reduce((s, p) => s + p.tickets, 0);

  if (!total) {
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.fillStyle = '#F6E3BD'; ctx.fill();
  } else {
    let a = rotation;
    list.forEach((p, i) => {
      const ang = (p.tickets / total) * TAU;
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, R, a, a + ang); ctx.closePath();
      ctx.fillStyle = COLORS[i % COLORS.length]; ctx.fill();
      if (list.length > 1) { ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.stroke(); }
      if (ang > 0.09) {
        ctx.save();
        ctx.translate(cx, cy); ctx.rotate(a + ang / 2);
        if (Math.cos(a + ang / 2) < 0) ctx.rotate(Math.PI);
        const size = Math.max(22, Math.min(52, R * ang * 0.42));
        ctx.font = `800 ${size}px 'Noto Sans SC','Microsoft YaHei',sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        let t = p.name; const maxW = R * 0.5;
        while (t.length > 1 && ctx.measureText(t).width > maxW) t = t.slice(0, -1);
        if (t !== p.name) t += '…';
        ctx.lineJoin = 'round'; ctx.lineWidth = 7; ctx.strokeStyle = 'rgba(60,20,20,.85)';
        const tx = (Math.cos(a + ang / 2) < 0 ? -1 : 1) * R * 0.62;
        ctx.strokeText(t, tx, 0); ctx.fillStyle = '#fff'; ctx.fillText(t, tx, 0);
        ctx.restore();
      }
      a += ang;
    });
  }
  // 金色外圈
  ctx.beginPath(); ctx.arc(cx, cy, R - 14, 0, TAU); ctx.lineWidth = 28; ctx.strokeStyle = '#EBAA28'; ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, R + 3, 0, TAU); ctx.lineWidth = 6; ctx.strokeStyle = '#784609'; ctx.stroke();
  // 中心
  ctx.beginPath(); ctx.arc(cx, cy, 96, 0, TAU); ctx.fillStyle = '#1E1414'; ctx.fill();
  ctx.lineWidth = 16; ctx.strokeStyle = '#EBAA28'; ctx.stroke();
  ctx.font = "800 88px 'Noto Sans SC','Microsoft YaHei',sans-serif"; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#FFE27A'; ctx.fillText('抽', cx, cy + 4);
}

function nameUnderPointer(rotation) {
  const list = state ? state.participants : [];
  const total = list.reduce((s, p) => s + p.tickets, 0);
  if (!total) return '';
  const theta = (((-Math.PI / 2 - rotation) % TAU) + TAU) % TAU;
  let acc = 0;
  for (const p of list) {
    acc += (p.tickets / total) * TAU;
    if (theta < acc) return p.name;
  }
  return list[list.length - 1].name;
}

/* ---------- 转动 ---------- */
function animateTo(endRot, ms) {
  return new Promise((resolve) => {
    const startRot = rot, t0 = performance.now();
    const ease = (t) => 1 - Math.pow(1 - t, 4);
    function frame(now) {
      const t = Math.min(1, (now - t0) / ms);
      rot = startRot + (endRot - startRot) * ease(t);
      drawWheel(rot);
      $('ticker').textContent = nameUnderPointer(rot);
      if (t < 1) requestAnimationFrame(frame); else resolve();
    }
    requestAnimationFrame(frame);
  });
}

async function doSpin() {
  if (spinning || !state || state.status !== 'idle') return;
  $('spin').disabled = true;
  const list = state.participants.slice();       // 转盘当前的分块顺序
  const total = list.reduce((s, p) => s + p.tickets, 0);
  const r = await api('/api/spin', { method: 'POST' });
  if (!r.ok) { $('hint').textContent = r.error || '转不了，稍后再试'; refresh(); return; }

  spinning = true;
  hideOverlay();
  let start = 0, span = 0;
  for (const p of list) {
    const ang = (p.tickets / total) * TAU;
    if (p.id === r.userId) { span = ang; break; }
    start += ang;
  }
  const within = start + span * (0.15 + Math.random() * 0.7);
  const targetMod = (((-Math.PI / 2 - within) % TAU) + TAU) % TAU;
  const curMod = ((rot % TAU) + TAU) % TAU;
  const delta = (((targetMod - curMod) % TAU) + TAU) % TAU;
  const endRot = rot + TAU * 6 + delta;

  await animateTo(endRot, Math.max(1500, r.animMs - 300));
  rot = endRot % TAU;
  spinning = false;
  await refresh();
}

/* ---------- 状态刷新与界面 ---------- */
async function refresh() {
  let s;
  try { s = await api('/api/state'); } catch (e) { return; }
  if (!s.ok) {
    document.body.style.background='#14231C'; document.body.innerHTML = '<div class="gone">🎄 这个转盘链接已经失效。<br>请回到 Discord，重新执行 /draw-christmas 获取新链接。</div>';
    clearInterval(timer);
    return;
  }
  serverOffset = s.serverTime - Date.now();
  state = s;
  render();
}

function avatarHtml(url, cls) {
  return url ? `<img class="${cls || ''}" src="${url}" alt="">` : `<div class="ph ${cls || ''}"></div>`;
}
function esc(t) { return String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

const ROW0 = 238, PITCH = 62.1, ROWH = 57;
function rowHtml(i, w) {
  const top = Math.round(ROW0 + PITCH * (i + 0.5) - ROWH / 2);
  if (!w) return `<div class="row empty" style="top:${top}px"><span class="num">${i + 1 + OFFSET}</span><div class="ph"></div><span class="nm">待抽取</span></div>`;
  const lead = w.place <= 3 ? `<img class="crown" src="/wheel-assets/crown${w.place}.png" alt="">` : `<span class="num">${w.place}</span>`;
  const ult = w.prize === 'ULTIMATE';
  return `<div class="row ${ult ? 'ult' : ''}" style="top:${top}px">${lead}${w.avatarUrl ? `<img class="av" src="${w.avatarUrl}" alt="">` : '<div class="av"></div>'}<span class="nm">${ult ? '🌟' : ''}${esc(w.name)}</span><img class="snow" src="/wheel-assets/snow.png" alt=""></div>`;
}
let OFFSET = 0;
function layout() {
  const s = Math.min(innerWidth / 1672, innerHeight / 941);
  $('stage').style.transform = `scale(${s}) translate(-836px,-470.5px)`;
}

function render() {
  $('badge').hidden = state.mode !== 'test';
  $('entrants').textContent = `入场 ${state.participants.length} 人`;

  const ws = state.winners;
  OFFSET = Math.max(0, ws.length - 10);
  const rows = [];
  for (let i = 0; i < 10; i++) {
    const w = ws[OFFSET + i];
    rows.push(rowHtml(i, w));
  }
  $('rows').innerHTML = rows.join('');

  const btn = $('spin'), hint = $('hint');
  const next = ws.length + 1;
  if (state.status === 'idle') {
    btn.disabled = spinning; btn.textContent = '开始转动';
    if (!spinning) $('ticker').textContent = `现在抽取：第 ${next} 位`;
    hint.textContent = state.upgraded && ws.length < state.upgradeTop ? '🌟 这一位将获得「主厨豪华至尊大礼」！' : '';
  } else if (state.status === 'done') {
    btn.disabled = true; btn.textContent = '开奖完成';
    $('ticker').textContent = `共 ${ws.length} 位得奖`;
    hint.textContent = ws.length < state.target ? `有 ${state.target - ws.length} 个名额因无人在场而空缺` : '恭喜以上所有幸运伙伴！';
  } else {
    btn.disabled = true; btn.textContent = '转动中…';
    if (!spinning) $('ticker').textContent = `第 ${next} 位 确认中`;
    hint.textContent = '';
  }

  if (!spinning) drawWheel(rot);

  if (!spinning) {
    if (state.status === 'waiting' && state.current) {
      showPick();
    } else if (state.lastEvent && state.lastEvent.at !== shownEventAt) {
      shownEventAt = state.lastEvent.at;
      showResult(state.lastEvent);
    }
  }
}

function showOverlay(avatarUrl, title, name, sub) {
  $('ov-avatar-wrap').innerHTML = avatarHtml(avatarUrl);
  $('ov-title').textContent = title;
  $('ov-name').textContent = name;
  $('ov-sub').innerHTML = sub;
  $('overlay').classList.remove('hidden');
}
function hideOverlay() { clearTimeout(overlayTimer); $('overlay').classList.add('hidden'); }

function showPick() {
  const c = state.current;
  clearTimeout(overlayTimer);
  let sub;
  if (state.mode === 'test') sub = '预演模式：不检查是否在场';
  else {
    const left = Math.max(0, Math.ceil((c.deadline - (Date.now() + serverOffset)) / 1000));
    sub = `请在 <b>${left}</b> 秒内进入语音频道 <b>${esc(state.channelName || '直播频道')}</b>`;
  }
  showOverlay(c.avatarUrl, `第 ${c.place} 位 · 抽到了`, c.name, sub);
}

function showResult(ev) {
  if (ev.type === 'win') {
    const ult = ev.prize === 'ULTIMATE';
    showOverlay(ev.avatarUrl, `🎉 第 ${ev.place} 位得奖`, ev.name, ult ? '🌟 主厨豪华至尊大礼' : '🎁 圣诞神秘盲盒');
    burst();
  } else {
    showOverlay(ev.avatarUrl, '⏰ 没有在场', ev.name, '视为放弃，重新抽取');
  }
  overlayTimer = setTimeout(hideOverlay, 5500);
}

/* ---------- 彩带 ---------- */
const cf = $('confetti'), cctx = cf.getContext('2d');
let parts = [];
function burst() {
  cf.width = innerWidth; cf.height = innerHeight;
  const colors = ['#E8B84A', '#C0392B', '#1F7A4D', '#F6F1E7', '#2C6FA3'];
  for (let i = 0; i < 160; i++) {
    parts.push({ x: innerWidth / 2, y: innerHeight / 2, vx: (Math.random() - 0.5) * 22, vy: -Math.random() * 20 - 4,
      s: 6 + Math.random() * 8, c: colors[i % colors.length], r: Math.random() * TAU, vr: (Math.random() - 0.5) * 0.4, life: 120 + Math.random() * 60 });
  }
  if (parts.length === 160) requestAnimationFrame(tickConfetti);
}
function tickConfetti() {
  cctx.clearRect(0, 0, cf.width, cf.height);
  parts = parts.filter((p) => p.life-- > 0);
  for (const p of parts) {
    p.x += p.vx; p.y += p.vy; p.vy += 0.5; p.vx *= 0.99; p.r += p.vr;
    cctx.save(); cctx.translate(p.x, p.y); cctx.rotate(p.r); cctx.fillStyle = p.c; cctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); cctx.restore();
  }
  if (parts.length) requestAnimationFrame(tickConfetti); else cctx.clearRect(0, 0, cf.width, cf.height);
}

$('spin').addEventListener('click', doSpin);
addEventListener('resize', layout); layout();
const timer = setInterval(() => { if (!spinning) refresh(); }, 1000);
refresh();
</script>
</body>
</html>
